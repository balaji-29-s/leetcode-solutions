name: Update LeetCode README

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate README
        shell: bash
        run: |
          python3 <<'PY'
          import os
          import re

          problems = []

          for item in os.listdir("."):
              if not os.path.isdir(item):
                  continue

              match = re.match(r"^(\d+)-(.+)$", item)

              if match:
                  number = int(match.group(1))
                  name = match.group(2).replace("-", " ").title()

                  problems.append((number, name, item))

          problems.sort()

          total = len(problems)
          goal = 300

          percentage = min(100, round(total * 100 / goal))

          filled = round(20 * percentage / 100)
          progress = "█" * filled + "░" * (20 - filled)

          readme = "# 🚀 LeetCode Solutions\n\n"
          readme += "My daily LeetCode practice and DSA preparation.\n\n"

          readme += "## 📊 Progress\n\n"
          readme += f"**{total} / {goal} Problems**\n\n"
          readme += f"`{progress}` **{percentage}%**\n\n"

          readme += "| Statistic | Count |\n"
          readme += "|-----------|------:|\n"
          readme += f"| 🧩 Total Solved | **{total}** |\n"
          readme += f"| 🎯 Goal | **{goal}** |\n\n"

          readme += "## 📝 Problems Solved\n\n"

          for number, name, folder in problems:
              readme += f"- [{number}. {name}]({folder}/)\n"

          readme += "\n## 🎯 Goal\n\n"
          readme += "My goal is to solve **300+ LeetCode problems** while preparing for software engineering placements.\n\n"

          readme += "## 💻 Language\n\n"
          readme += "**C++**\n\n"

          readme += "## ⚡ Automatic Sync\n\n"
          readme += "Solutions are automatically synchronized from LeetCode using **LeetHub-3.0**.\n\n"
          readme += "README statistics are automatically updated using **GitHub Actions**.\n"

          with open("README.md", "w", encoding="utf-8") as file:
              file.write(readme)

          print(f"Found {total} LeetCode problems")
          PY

      - name: Commit README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "README is already up to date."
          else
            git commit -m "docs: update LeetCode progress"
            git push
          fi
